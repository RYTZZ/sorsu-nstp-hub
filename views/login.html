<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SorSU NSTP Hub</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    .login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-light));
      padding: 2rem 0;
    }
    
    .login-card {
      background-color: var(--bg-primary);
      padding: 3rem;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      max-width: 450px;
      width: 90%;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-header h1 {
      color: var(--primary-orange);
      margin-bottom: 0.5rem;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-light);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color var(--transition-fast);
    }
    
    .back-link:hover {
      color: var(--primary-orange);
    }
  </style>
</head>
<body>
  <section class="login-section">
    <div class="login-card">
      <a href="/" class="back-link">← Back to Home</a>
      
      <div class="login-header">
        <h1>Admin Login</h1>
        <p style="color: var(--text-light);">Access the admin dashboard</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="admin@sorsu.edu.ph" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">
          Login
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--secondary-light);">
        <p style="color: var(--text-muted); font-size: 0.875rem;">
          For account assistance, contact: nstp@sorsu.edu.ph
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Check if already logged in
    if (AuthService.isAuthenticated()) {
      window.location.href = '/admin/dashboard';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      const originalText = loginBtn.textContent;
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        AuthService.setToken(data.token);
        AuthService.setUser(data.user);

        showToast('Login successful!', 'success');
        
        // Redirect based on role
        setTimeout(() => {
          window.location.href = '/admin/dashboard';
        }, 1000);
      } catch (error) {
        console.error('Login error:', error);
        showToast(error.message || 'Login failed', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
